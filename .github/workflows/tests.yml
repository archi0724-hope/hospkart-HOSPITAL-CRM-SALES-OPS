name: Application and browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hospkart_test
          POSTGRES_PASSWORD: local-test-only-password
          POSTGRES_DB: hospkart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tests/check_postgres.py
        env:
          CRM_TEST_DATABASE_URL: postgresql://hospkart_test:local-test-only-password@127.0.0.1:5432/hospkart_test
          PG_BROWSER_CHECKS: 'false'
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/check_admin_access.py
        env:
          BROWSER_CHANNELS: chromium
      - run: python tests/check_spreadsheet_sync.py
        env:
          BROWSER_CHANNELS: chromium
      - run: python tests/check_production_browsers.py
        env:
          BROWSER_CHANNELS: chromium,chromium
      - run: python tests/check_quotesaarthi.py
        env:
          BROWSER_CHANNELS: chromium,chromium
      - run: python tests/check_crm_knowledge.py
        env:
          BROWSER_CHANNELS: chromium,chromium
      - run: python tests/check_drive_import.py
        env:
          BROWSER_CHANNELS: chromium,chromium
